<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> chai aur code </h1>
    <button id = "one">stop</button>
</body>
<script>
    // api calls => these are used when we want some event to occur after a time . this changes can be seen only on browser 
    //api require two things handler => nothing but a call back function and time 

    const changeText = function(){
        document.querySelector("h1").innerHTML="best java script series"
        console.log("done")
    }
    const changeMe = setTimeout(changeText,2000)

    // now suppose we have set an api but if we want that someone press or do any event then it not execute 

    document.querySelector("#one").addEventListener('click',function(){
        clearTimeout(changeMe);// always remeber here the refrence of settime out is passed only
        console.log("done")
    })


    // set interval is used for after a given interval of time the code is executed consecuently
    // setInterval(function(){
    //     console.log("hitesh",Date.now())
    // },2000)
    // in set interval we can also pass the parameter
    const fun = function(str){
        console.log(str,Date.now());

    }
    const IntervalId = setInterval(fun,1000,"hi")
    clearInterval(IntervalId)

</script>
</html>
