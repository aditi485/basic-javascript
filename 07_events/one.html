   //+++++++++++++++++EVENT PROPOGATION+++++++++++++++++



   // event propogation => if suppose two event are appling on the single text then 
   // 1=> capturing 
   // 2=> bubling
   const body = document.querySelector("body").addEventListener('click',function(e){
    alert ("you click the body")
    
   },false)
   // this being true first inside will be display then div => it means ineer to outer



   //++++++++++++EVENT OBJECT ++++++++++++++++++++



   // now study about event object  => e = this tells about e.target ,e.clientX , e.client Y and many more 
// sometimes we donot want bubling in that case
 const body1 = document.querySelector("body").addEventListener('click',function(e){
    alert ("you click the body");
